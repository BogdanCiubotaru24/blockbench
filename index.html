	<script>
		/**
		 * IK CSV Visualizer (menu + cube + rig re-check)
		 * Actions:
		 *  - IK: Load & Visualize CSV
		 *  - IK: Re-evaluate CSV with Current Rig
		 *  - IK: Toggle CSV Bounding Box
		 *  - IK: Clear CSV Visualization
		 */
		(function () {
			if (!window.THREE) { console.warn('[ik_csv_visualizer] THREE missing'); return; }
			const hasBB = typeof Blockbench !== 'undefined';
			const PIXEL_POINT_SIZE = 3;     // smaller points
			const DEFAULT_OK_EPS = 1e-2;    // green/red cutoff (absolute, not relative)

			// ---------- utils ----------
			function greenRed01(t) { t = Math.max(0, Math.min(1, t || 0)); return { r: t, g: 1 - t, b: 0 }; }
			function readFileAsText(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result || '')); fr.onerror = rej; fr.readAsText(file); }); }
			function parseCSV(text) {
				const lines = String(text || '').replace(/\r/g, '').split('\n').filter(Boolean);
				if (!lines.length) return [];
				const head = lines.shift().split(',').map(s => s.trim());
				return lines.map(ln => {
					const cols = ln.split(',').map(s => s.trim()); const r = {};
					for (let i = 0; i < head.length; i++) {
						const k = head[i], v = cols[i];
						if (k === 'ok') r.ok = (v === '1' || String(v).toLowerCase() === 'true');
						else r[k] = Number(v);
					}
					return r;
				});
			}
			function pickCSVs() {
				return new Promise(resolve => {
					const input = document.createElement('input');
					input.type = 'file'; input.accept = '.csv,text/csv'; input.multiple = true; input.style.display = 'none';
					document.body.appendChild(input);
					input.addEventListener('change', () => { const files = Array.from(input.files || []); document.body.removeChild(input); resolve(files); }, { once: true });
					input.click();
				});
			}

			// ---------- Blockbench rig helpers ----------
			function findSelectedNullAndAnimator() {
				const sel = Outliner?.selected?.[0];
				if (!(sel && sel instanceof NullObject)) { Blockbench.showQuickMessage('Select a Null Object (IK controller) first.'); return null; }
				let anim = null;
				if (Animation?.selected?.animators) for (const a of Object.values(Animation.selected.animators)) {
					if (a instanceof NullObjectAnimator && a.uuid === sel.uuid) { anim = a; break; }
				}
				if (!anim) { Blockbench.showQuickMessage('No NullObjectAnimator found for the selected null in this animation.'); return null; }
				return { nullObj: sel, anim };
			}
			function setNullWorldPosition(nullObj, worldV3) {
				const parent = nullObj.mesh.parent || scene;
				const local = worldV3.clone(); parent.worldToLocal(local);
				nullObj.mesh.position.copy(local); nullObj.mesh.updateMatrixWorld();
			}

                        // ---------- scene state ----------
                        let gridRows = null, circleRows = null; // current datasets
                        let csvPointSets = [], csvCircleLines = [], csvBoxHelper = null;
                        let lastMetrics = ['posErr'];

			function disposeObj(obj) {
				try {
					if (!obj) return;
					if (obj.geometry) obj.geometry.dispose();
					if (obj.material) {
						if (Array.isArray(obj.material)) obj.material.forEach(m => m && m.dispose());
						else obj.material.dispose();
					}
				} catch { }
			}
                        function clearCSVMeshes() {
                                for (const set of csvPointSets) {
                                        for (const obj of [set.ok, set.fail]) {
                                                if (obj && window.scene) scene.remove(obj);
                                                disposeObj(obj);
                                        }
                                }
                                for (const line of csvCircleLines) {
                                        if (line && window.scene) scene.remove(line);
                                        disposeObj(line);
                                }
                                if (csvBoxHelper && window.scene) scene.remove(csvBoxHelper);
                                csvPointSets = [];
                                csvCircleLines = [];
                                csvBoxHelper = null;
                        }

			function computeBounds(rowsList) {
				const b = new THREE.Box3();
				let init = false;
				for (const rows of rowsList) {
					if (!Array.isArray(rows)) continue;
					for (const r of rows) {
						if (![r.x, r.y, r.z].every(Number.isFinite)) continue;
						const v = new THREE.Vector3(r.x, r.y, r.z);
						if (!init) { b.min.copy(v); b.max.copy(v); init = true; } else b.expandByPoint(v);
					}
				}
				return init ? b : null;
			}

			function ensureBoxHelper() {
				if (csvBoxHelper) { scene.add(csvBoxHelper); return; }
				const bounds = computeBounds([gridRows, circleRows]);
				if (!bounds) return;
				csvBoxHelper = new THREE.Box3Helper(bounds, new THREE.Color(0x00aaff));
				scene.add(csvBoxHelper);
			}

			// ---------- renderer ----------
                        function renderCSV({ pointSizePx = PIXEL_POINT_SIZE, metrics = ['posErr'] } = {}) {
                                clearCSVMeshes();
                                metrics = Array.isArray(metrics) && metrics.length ? metrics : ['posErr'];
                                lastMetrics = metrics.slice();

                               for (const metric of metrics) {
                                       // Determine green/red threshold
                                       // Determine green/red threshold.
                                       // posErr uses an absolute epsilon so points near 0 stay green even if
                                       // the dataset contains large outliers; other metrics use a relative range.
                                       let maxVal;
                                       if (metric === 'posErr') {
                                               maxVal = DEFAULT_OK_EPS;
                                       } else {
                                               // Fall back to relative range for any other metric
                                               const allVals = [];
                                               if (Array.isArray(gridRows)) allVals.push(...gridRows.map(r => r[metric]).filter(Number.isFinite));
                                               if (Array.isArray(circleRows)) allVals.push(...circleRows.map(r => r[metric]).filter(Number.isFinite));
                                               maxVal = Math.max(1e-9, allVals.length ? Math.max(...allVals) : 1);
                                       }

                                        // --- GRID points (ok/fail split) ---
                                        if (Array.isArray(gridRows) && gridRows.length) {
                                                const posOK = [], colOK = [], posFail = [], colFail = [];
                                                let total = 0, pass = 0;
                                                for (const r of gridRows) {
                                                        if (![r.x, r.y, r.z].every(Number.isFinite)) continue;
                                                        const val = r[metric];
                                                        if (!Number.isFinite(val)) continue;
                                                        const ok = (typeof r.okRig === 'boolean') ? r.okRig
                                                                : (typeof r.ok === 'boolean') ? r.ok
                                                                        : (metric === 'posErr' ? (val <= DEFAULT_OK_EPS) : true);
                                                        const t = Math.min(Math.max(val / maxVal, 0), 1);
                                                        const c = greenRed01(t);
                                                        const pArr = [r.x, r.y, r.z];
                                                        if (ok) { posOK.push(...pArr); colOK.push(c.r, c.g, c.b); pass++; }
                                                        else { posFail.push(...pArr); colFail.push(c.r, c.g, c.b); }
                                                        total++;
                                                }
                                                const set = { ok: null, fail: null };
                                                if (posOK.length) {
                                                        const g = new THREE.BufferGeometry();
                                                        g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(posOK), 3));
                                                        g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(colOK), 3));
                                                        const m = new THREE.PointsMaterial({ size: pointSizePx, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.95 });
                                                        set.ok = new THREE.Points(g, m); scene.add(set.ok);
                                                }
                                                if (posFail.length) {
                                                        const g = new THREE.BufferGeometry();
                                                        g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(posFail), 3));
                                                        g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(colFail), 3));
                                                        const m = new THREE.PointsMaterial({ size: pointSizePx, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.95 });
                                                        set.fail = new THREE.Points(g, m); scene.add(set.fail);
                                                }
                                                csvPointSets.push(set);
                                                if (hasBB) Blockbench.showQuickMessage(`Grid (${metric}): ${pass}/${total} passed.`);
                                        }

                                        // --- CIRCLE as colored polyline ---
                                        if (Array.isArray(circleRows) && circleRows.length >= 2) {
                                                const pos = [], col = [];
                                                for (const r of circleRows) {
                                                        if (![r.x, r.y, r.z].every(Number.isFinite)) continue;
                                                        const val = r[metric];
                                                        if (!Number.isFinite(val)) continue;
                                                        const t = Math.min(Math.max(val / maxVal, 0), 1);
                                                        const c = greenRed01(t);
                                                        pos.push(r.x, r.y, r.z); col.push(c.r, c.g, c.b);
                                                }
                                                const g = new THREE.BufferGeometry();
                                                g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(pos), 3));
                                                g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(col), 3));
                                                const m = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.95 });
                                                const line = new THREE.Line(g, m); scene.add(line);
                                                csvCircleLines.push(line);
                                        }
                                }

                                ensureBoxHelper(); // draw cube bounds
                        }

			// ---------- actions ----------
                        async function actLoad() {
                                try {
                                        const files = await pickCSVs(); if (!files?.length) { if (hasBB) Blockbench.showQuickMessage('No CSV selected'); return; }
                                        const texts = await Promise.all(files.map(readFileAsText));
                                        const sets = texts.map(parseCSV).filter(a => a?.length);

                                        gridRows = null; circleRows = null;
                                        for (const rows of sets) {
                                                const f = rows[0] || {};
                                                const isGrid = ('ix' in f) && ('iy' in f);
                                                const isCircle = !isGrid && ('i' in f);
                                                if (isGrid) gridRows = rows;
                                                else if (isCircle) circleRows = rows;
                                        }
                                        if (!gridRows && !circleRows) { Blockbench.showQuickMessage('Unrecognized CSV headers. Need ix,iy(,iz),x,y,z,posErr,targetDist,ok (grid) or i,x,y,z,posErr,ok (circle).'); return; }
                                        new Dialog({
                                                id: 'ik_csv_metrics',
                                                title: 'Visualize CSV Metrics',
                                                width: 260,
                                                form: {
                                                        err:  { label: 'Positional error', type: 'checkbox', value: true },
                                                        dist: { label: 'Distance to target', type: 'checkbox', value: false }
                                                },
                                                onConfirm(form) {
                                                        const metrics = [];
                                                        if (form.err) metrics.push('posErr');
                                                        if (form.dist) metrics.push('targetDist');
                                                        renderCSV({ metrics });
                                                }
                                        }).show();
                                } catch (e) { console.error(e); Blockbench.showQuickMessage('CSV load failed. See console.'); }
                        }

			async function actRecheckRig() {
				if (!gridRows && !circleRows) { Blockbench.showQuickMessage('Load CSV first.'); return; }
				const ctx = findSelectedNullAndAnimator(); if (!ctx) return;
				const { nullObj, anim } = ctx;

				// store/restore null position
				const origPos = nullObj.mesh.getWorldPosition(new THREE.Vector3());
				const eps = DEFAULT_OK_EPS;

				function evalRows(rows) {
					if (!Array.isArray(rows)) return;
					for (const r of rows) {
						if (![r.x, r.y, r.z].every(Number.isFinite)) continue;
						setNullWorldPosition(nullObj, new THREE.Vector3(r.x, r.y, r.z));
						const res = anim.displayIK(true); // patched to return __metrics
						const m = (res && res.__metrics) || { posErr: Number.POSITIVE_INFINITY };
						r.posErrRig = m.posErr;
						r.okRig = (m.posErr <= eps);
					}
				}
				evalRows(gridRows);
				evalRows(circleRows);

				// restore and refresh once
				setNullWorldPosition(nullObj, origPos);
				anim.displayIK(false);

                                renderCSV({ metrics: lastMetrics });
                                Blockbench.showQuickMessage('CSV re-evaluated with current rig limits.');
                        }

			function actToggleBox() {
				if (!csvBoxHelper) { ensureBoxHelper(); Blockbench.showQuickMessage('Bounding box shown.'); return; }
				csvBoxHelper.visible = !csvBoxHelper.visible;
				Blockbench.showQuickMessage(csvBoxHelper.visible ? 'Bounding box shown.' : 'Bounding box hidden.');
			}

			function actClear() { clearCSVMeshes(); Blockbench.showQuickMessage('CSV visualization cleared.'); }

			// ---------- register actions + robust menu attach ----------
			function registerActions() {
				if (typeof BARS === 'undefined') return false;
				BARS.defineActions(() => {
					new Action('ik_load_csv_visualizer', {
						icon: 'scatter_plot', name: 'IK: Load & Visualize CSV', condition: () => Modes.animate, click: actLoad
					});
					new Action('ik_recheck_csv_with_rig', {
						icon: 'autorenew', name: 'IK: Re-evaluate CSV with Current Rig', condition: () => Modes.animate, click: actRecheckRig
					});
					new Action('ik_toggle_csv_box', {
						icon: 'crop_din', name: 'IK: Toggle CSV Bounding Box', condition: () => Modes.animate, click: actToggleBox
					});
					new Action('ik_clear_csv_visualizer', {
						icon: 'layers_clear', name: 'IK: Clear CSV Visualization', condition: () => Modes.animate, click: actClear
					});
				});
				return true;
			}

			function attachToMenus() {
				try {
					if (!window.BarItems) return false;
					const menus = [BarItems.animation_menu, BarItems.tools_menu].filter(Boolean);
					if (!menus.length) return false;
					for (const m of menus) {
						if (!Array.isArray(m.children)) continue;
						// avoid duplicates
						['ik_load_csv_visualizer', 'ik_recheck_csv_with_rig', 'ik_toggle_csv_box', 'ik_clear_csv_visualizer'].forEach(id => {
							if (!m.children.includes(id)) m.children.push(id);
						});
					}
					return true;
				} catch { return false; }
			}

			// Try now, then keep nudging until UI is ready
			let actionsReady = registerActions();
			let menusReady = attachToMenus();

			const tick = setInterval(() => {
				if (!actionsReady) actionsReady = registerActions();
				if (!menusReady) menusReady = attachToMenus();
				if (actionsReady && menusReady) clearInterval(tick);
			}, 250);

			console.log('[ik_csv_visualizer] Ready. Find under Animation/Tools menus or via search.');
		})();
	</script>

	<div id="overlay_message_box" style="display: none;">
		<div>
			<h3><i class="material-icons icon">keyboard</i><span class="tl">keybindings.recording</span></h3>
			<p class="tl">keybindings.press</p>
			<button class="tl" onclick="Keybinds.recording.stopRecording()">dialog.cancel</button>
			<button class="tl" onclick="Keybinds.recording.clear().stopRecording()">keybindings.clear</button>
			<div id="keybind_input_box" contenteditable="true" style="font-size: 0"></div>
		</div>
	</div>

	<div id="dialog_wrapper"></div>

	<header>
		<ul id="mac_window_menu" hidden></ul>
		<div id="corner_logo" class="app-drag-region">
			<img class="blockbench_logo" src="assets/logo_text_white.svg" alt="Blockbench" />
		</div>
		<ul id="menu_bar" class="scroll_horizontal"></ul>
		<div id="title_bar_home_button" class="tool" onclick="Interface.tab_bar.openNewTab()"><i
				class="material-icons icon">home</i></div>
		<div class="app-drag-region" id="header_free_bar"></div>
		<div id="update_menu"></div>
		<div id="settings_profiles_header_menu" class="hidden tool">
			<i class="material-icons icon">manage_accounts</i>
		</div>
		<ul id="windows_window_menu" hidden>
			<li onclick="currentwindow.minimize()">
				<svg width="18" height="18" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
					<path d="M14 8v1H3V8h11z" />
				</svg>
			</li>
			<li onclick="currentwindow.isMaximized() ? currentwindow.unmaximize() : currentwindow.maximize()">
				<svg class="restore" width="18" height="18" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"
					fill="currentColor">
					<path d="M3 5v9h9V5H3zm8 8H4V6h7v7z" />
					<path fill-rule="evenodd" clip-rule="evenodd" d="M5 5h1V4h7v7h-1v1h2V3H5v2z" />
				</svg>
				<svg class="maximize" width="18" height="18" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"
					fill="currentColor">
					<path d="M3 3v10h10V3H3zm9 9H4V4h8v8z" />
				</svg>
			</li>
			<li class="wwm_r" onclick="currentwindow.close()">
				<svg width="18" height="18" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
					<path fill-rule="evenodd" clip-rule="evenodd"
						d="M7.116 8l-4.558 4.558.884.884L8 8.884l4.558 4.558.884-.884L8.884 8l4.558-4.558-.884-.884L8 7.116 3.442 2.558l-.884.884L7.116 8z" />
				</svg>
			</li>
		</ul>
		<button id="web_download_button" hidden><a href="https://blockbench.net/downloads">
				<span class="tl">web.download_app</span>
				<i class="material-icons icon">system_update</i>
			</a></button>
	</header>


	<div id="page_wrapper" class="invisible start_screen">

		<div id="blackout" class="darken"></div>

		<div id="tab_bar" :class="{drag_mode: drag_target_index !== null}">
			<div id="tab_bar_list" @wheel="mousewheelBar($event)" ref="tab_bar_list">
				<div class="project_tab" v-for="(project, index) in tabs" :key="project.uuid" :class="{
						selected: project.selected,
						new_tab: project.is_new_tab,
						dragging: index == drag_target_index,
						move_back:  (drag_position_index !== null && index > drag_target_index && drag_position_index >= index),
						move_forth: (drag_position_index !== null && index < drag_target_index && drag_position_index <= index)
					}" :title="project.name || project.geometry_name || ''" @dblclick="project.openSettings()"
					@contextmenu="project.showContextMenu($event)" @mousedown="mouseDown(project, $event)"
					@mouseup="mouseUp(project, $event)" @mouseenter="mouseEnter(project, $event)"
					@mouseleave="mouseLeave(project, $event)">
					<dynamic-icon :icon="project.format ? project.format.icon : 'home'"></dynamic-icon>
					<label class="project_tab_session_badge" v-if="project.EditSession"><i
							class="material-icons">group</i>{{ project.EditSession.client_count }}</label>
					<label>{{ project.getDisplayName() }}</label>
					<div class="project_tab_close_button" :class="{unsaved: !project.saved}" :title="close_tab_label"
						@click="project.close()">
						<i class="material-icons close_icon">clear</i>
						<i class="material-icons unsaved_icon" v-if="!project.saved">fiber_manual_record</i>
					</div>
				</div>
				<div id="new_tab_button" v-if="!new_tab.visible" @click="openNewTab()" :title="new_tab.name">
					<i class="material-icons">add</i>
				</div>
			</div>
			<div id="search_tab_button" v-if="projects.length > 1" @click="tabOverview()" :title="search_tabs_label">
				<i class="material-icons">view_module</i>
			</div>
		</div>

		<dialog id="action_selector"></dialog>

		<div id="start_screen"></div>

		<div id="work_screen" hidden>

			<div id="main_toolbar">
				<div class="toolbar_wrapper narrow tools"></div>

				<div class="toolbar_wrapper narrow tool_options"></div>
				<ul id="mode_selector" v-if="showModes()">
					<li v-for="mode in options" v-if="Condition(mode.condition)"
						v-bind:class="{selected: mode.selected}" v-on:mousedown="mode.select()">{{ mode.name }}</li>
				</ul>
			</div>

			<div id="left_bar" class="sidebar"></div>

			<div id="right_bar" class="sidebar"></div>

			<div id="center">
				<ul id="toast_notification_list"></ul>

				<div id="top_slot"></div>
				<div id="preview">
					<div class="clamped_reference_images"></div>
				</div>
				<div id="bottom_slot"></div>

				<div id="mobile_panel_overlay" hidden></div>
			</div>
			<div id="status_bar"></div>

			<div id="panel_selector_bar"></div>

		</div>

	</div>

	<script src="js/boot_loader.js"></script>
	<script>
		if (!Blockbench || !Blockbench.setup_successful) {
			document.getElementById('loading_error_message').style.display = 'block'
			if (window.require) {
				require('electron').remote.getCurrentWindow().webContents.openDevTools()
			}
		} else {
			document.getElementById('loading_error_message').innerHTML = 'No loading errors...'
		}
	</script>
</body>

</html>
